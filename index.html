<!DOCTYPE HTML>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script defer src="javascript.js"></script>
    <div class="main-page">
        <div class="sidebar">
            <div class="form-button">
            <button popovertarget="submission" >Book Form</button>
            </div>
                <dialog id="submission" popover>
                    <form id="bookform">
                        <div class="form">
                            <div class="form-text">
                                <label for="author">Author:</label>
                                <input type="text" id="author" name="author" minlength="1" required>
                            </div>

                            <div class="form-text">
                                <label for="title">Title:</label>
                                <input type="text" id="title" name="title" minlength="1" required>
                            </div>

                            <div class="form-text">
                                <label for="number-of-pages">Number of pages:</label>
                                <input type="number" id="number-of-pages" name="number-of-pages" required>
                            </div>

                            <div class="form-text">
                                <p>Have you read it:</p>
                                <div class="radio">
                                    <label for="not-read">Not Read</label>
                                    <input type="radio" id="not-read" name="read-status" value="not-read" required>
                                </div>
                                <div class="radio">
                                    <label for="ongoing">Ongoing</label>
                                    <input type="radio" id="ongoing" name="read-status" value="ongoing" required>
                                </div>
                                <div class="radio">
                                    <label for="read">Read</label>
                                    <input type="radio" id="read" name="read-status" value="read" required>
                                </div>
                            </div>
                             
                            <div class="btn">
                                <button type="submit">Add Book to Library</button>
                            </div>
                        </div>
                    </form>
                    <button popovertarget="submission" popovertargetaction="hide">Close</button>
                </dialog>
        </div>

        <div class="display">
        </div>
    </div>
</body>
